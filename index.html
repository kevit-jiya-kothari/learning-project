<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - OutreachHub</title>

</head>


<body>

    <!-- Login Page -->

    <main>

        <header>

            <h1>OutreachHub</h1>

        </header>


        <!-- Login Form -->

        <section>

            <h2>Login to Your Workspace</h2>
            <p>Enter your account details to continue.</p>


            <form action="home.html" method="get">


                <!-- Email -->

                <p>

                    <label for="email">Email Address:  </label>

                    <br>

                    <input type="email" id="email" name="email" placeholder="Enter your email" required>

                </p>


                <!-- Password -->

                <p>

                    <label for="password">Password:</label>

                    <br>

                    <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" required>

                </p>


                <!-- Remember Me -->

                <p>

                    <input type="checkbox" id="remember" name="remember" >

                    <label for="remember">Remember Me</label>

                </p>


                <!-- Show Password -->

                <p>

                    <input type="checkbox" id="show-password" name="show-password">

                    <label for="show-password">Show Password</label>

                </p>


                <!-- Login Button -->

                <p>

                    <button type="submit">Login</button>

                </p>


                <!-- Forgot Password -->

                <p>

                    <a href="forgot-password.html">Forgot Password?</a>

                </p>

            </form>

        </section>
