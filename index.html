<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OutreachHub</title>
    <link rel="stylesheet" href="./scss/main.css">
</head>
<body class="login-page-body">

    <!-- Login Page -->
    <main class="login-page">

        <div class="login-container">
            <!-- Brand -->
            <header class="brand">
                <h1>OutreachHub</h1>
                <p>Connect. Reach. Grow.</p>
            </header>

            <!-- Login Card -->
            <section class="login-card">

                <!-- Login Header -->
                <div class="login-header">
                    <h2>Login to Your Workspace</h2>
                    <p>Enter your account details to continue.</p>
                </div>

                <!-- Login Form -->
                <form class="login-form" action="home.html" method="get">

                    <!-- Email -->
                    <p>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </p>

                    <!-- Password -->
                    <div class="password-label">
                        <label for="password">Password:</label>
                    </div>

                    <p>
                        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="6" required>
                    </p>

                    <!-- Remember Me and Forgot Password -->
                    <div class="form-options">
                        <div class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Remember Me</label>
                        </div>

                        <a href="forgot-password.html">Forgot Password?</a>
                    </div>

                    <!-- Login Button -->
                    <button class="login-button" type="submit">Login</button>

                </form>

                <!-- Register Link -->
                <div class="register-link">
                    <p>
                        Don't have an account?
                        <a href="register.html">Create an Account</a>
                    </p>
                </div>

            </section>

            <!-- Footer -->
            <footer class="login-footer">

                <p>© 2026 OutreachHub</p>

            </footer>

        </div>

    </main>

</body>
</html>
