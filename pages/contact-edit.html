    <main>

        <h1>Edit Contact</h1>

        <form id="contactForm">


            <!-- Personal Information -->

            <fieldset>

                <legend>
                    Personal Information
                </legend>


                <p>

                    <label for="name">
                        Full Name:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                </p>

                <p>

                    <label for="phone">
                        Phone Number:
                    </label>

                    <br>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                    >

                </p>

                <p>

                    <label for="email">
                        Email Address:
                    </label>

                    <br>

                    <input
                        type="email"
                        id="email"
                        name="email"
                    >

                </p>

                <p>

                    <label for="tags">
                        Tags:
                    </label>

                    <br>

                    <input
                        type="text"
                        id="tags"
                        name="tags"
                    >

                </p>

            </fieldset>
